name: Build QA Research Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download QA Research Library app icon
        run: |
          mkdir -p app/src/main/res/drawable
          curl -L \
            -o app/src/main/res/drawable/app_icon.png \
            https://raw.githubusercontent.com/bonifaceudu-creator/qa-research-library-app/main/images/icon-512.png

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QA-Research-Library-WebView-APK
          path: app/build/outputs/apk/debug/app-debug.apk
